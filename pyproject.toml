[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = []
dependencies = [
  "attrs>=22.2.0",
  "httpx>=0.23.0,<0.29.0",
  "python-dateutil>=2.8.0,<3"
]
description = "A client library for accessing FastAPI"
name = "token_validator_client"
readme = "README.md"
requires-python = "~=3.9"
version = "0.1.0"

[tool.hatch.build.targets.sdist]
include = [
  "CHANGELOG.md",
  "token_validator_client",
  "token_validator_client/py.typed"
]

[tool.hatch.build.targets.wheel]
include = [
  "CHANGELOG.md",
  "token_validator_client",
  "token_validator_client/py.typed"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008"]
select = ["F", "I", "UP"]
